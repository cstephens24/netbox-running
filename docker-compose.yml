services:
  netbox: &netbox
    image: docker.io/netboxcommunity/netbox:${VERSION-v4.6-5.0.0}
    depends_on:
      - redis
      - redis-cache
    env_file: env/netbox.env
    user: "netbox:root"
    healthcheck:
      test: curl -f http://localhost:8080/login/ || exit 1
      start_period: 90s
      timeout: 3s
      interval: 15s
    volumes:
      - ./configuration:/etc/netbox/config:z,ro
      - netbox-media-files:/opt/netbox/netbox/media:rw
      - netbox-reports-files:/opt/netbox/netbox/reports:rw
      - netbox-scripts-files:/opt/netbox/netbox/scripts:rw
  netbox-worker:
    <<: *netbox
    depends_on:
      netbox:
        condition: service_healthy
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      test: ps -aux | grep -v grep | grep -q rqworker || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s

  # redis
  redis:
    image: docker.io/valkey/valkey:9.0-alpine
    command:
      - sh
      - -c # this is to evaluate the $REDIS_PASSWORD from the env
      - valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD ## $$ because of docker-compose
    healthcheck: &redis-healthcheck
      test: '[ $$(valkey-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    env_file: env/redis.env
    volumes:
      - netbox-redis-data:/data
  redis-cache:
    image: docker.io/valkey/valkey:9.0-alpine
    command:
      - sh
      - -c # this is to evaluate the $REDIS_PASSWORD from the env
      - valkey-server --requirepass $$REDIS_PASSWORD ## $$ because of docker-compose
    healthcheck: *redis-healthcheck
    env_file: env/redis-cache.env
    volumes:
      - netbox-redis-cache-data:/data

# volumes:
#   netbox-media-files:
#     driver: local
#   netbox-redis-cache-data:
#     driver: local
#   netbox-redis-data:
#     driver: local
#   netbox-reports-files:
#     driver: local
#   netbox-scripts-files:
#     driver: local

volumes:
  netbox-redis-cache-data:
    driver: local
  netbox-redis-data:
    driver: local
  netbox-media-files:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=10.0.0.30,nolock,soft,nfsvers=4"
      device: ":/mnt/FastSSD/TinyProx/netbox-data/media"

  netbox-scripts-files:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=10.0.0.30,nolock,soft,nfsvers=4"
      device: ":/mnt/FastSSD/TinyProx/netbox-data/scripts"

  netbox-reports-files:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=10.0.0.30,nolock,soft,nfsvers=4"
      device: ":/mnt/FastSSD/TinyProx/netbox-data/reports"